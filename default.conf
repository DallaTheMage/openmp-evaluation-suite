# =============================================================================
# Default benchmark configuration
# =============================================================================
#
# This configuration provides conservative, hardware-independent defaults
# intended for basic benchmark execution and functional validation.
#
# These values are not intended for rigorous performance characterization.
# Machine-specific experimental configurations should be generated
# separately and adjusted to the target hardware and research objectives.
# Almost every configuration has a fallback default value runtime generated.
# =============================================================================

# =============================================================================
# Compiler configuration
# =============================================================================

# C compiler executable used to build the benchmark.
COMPILERNAME=cc


# =============================================================================
# Parallel execution configuration
# =============================================================================

# Comma-separated list of thread counts to benchmark.
# Including 1 thread is required to compute scaling metrics,
# such as speedup and parallel efficiency.
THREAD_LIST=1,2

# OpenMP scheduling policy:
#   1 = static
#   2 = dynamic
#   3 = guided
CHOSEN_SCHEDULE_ID=1U

# Comma-separated list of OpenMP chunk sizes to benchmark.
# Each value is passed directly to the OpenMP schedule clause:
# schedule(CHOSEN_SCHEDULE, chunk_size).
CHUNK_SIZE_LIST=8U


# =============================================================================
# Problem size and memory configuration
# =============================================================================

# Base-2 logarithm of the total number of double-precision elements
# allocated for full-scale benchmarks.
# The allocated dataset contains 2^PROBLEM_LOG2_SIZE elements.
PROBLEM_LOG2_SIZE=20U

# Base-2 logarithm of the number of double-precision elements per thread
# during proportional benchmarks.
# The total problem size grows linearly with the thread count:
# total_size = (2^SIZE_PER_THREAD_LOG2) * num_threads.
SIZE_PER_THREAD_LOG2=17U

# Memory alignment boundary, in bytes, for aligned allocations.
# A 64-byte alignment matches the cache-line size of many modern CPUs
# and may facilitate aligned SIMD memory accesses.
MEMORY_ALIGNMENT=64U

# Comma-separated list of base-2 logarithms defining working window sizes.
# Each window contains 2^log2_size double-precision elements (8 bytes each)
# and operates within the allocated dataset.
# Different window sizes allow evaluating memory hierarchy effects
# without changing the total allocated dataset.
WINDOWS_LOG2_LIST=12U,14U,16U,18U


# =============================================================================
# Cache configuration
# =============================================================================

# Detected last-level data/unified cache (LLC) capacity, in bytes.
# A value of 0 indicates that cache-size detection was unsuccessful.
DETECTED_LLC_SIZE_BYTES=0ULL

# Enable or disable cache eviction after each benchmark kernel execution.
#   0 = disabled
#   1 = enabled
CACHE_EVICTION_ENABLED=0U

# Multiplier applied to the detected LLC capacity to determine
# the cache eviction buffer size:
# eviction_buffer_size = CACHE_EVICTION_MULTIPLIER * LLC_size.
CACHE_EVICTION_MULTIPLIER=2U

# Distance, in bytes, between consecutive eviction buffer accesses.
# A 64-byte stride typically accesses a different cache line each time.
CACHE_EVICTION_STRIDE_BYTES=64U


# =============================================================================
# Benchmark execution configuration
# =============================================================================

# Enable or disable full-scale benchmark execution.
# Full-scale benchmarks generate execution configurations covering
# all valid combinations of thread counts, chunk sizes,
# compatible kernels, and data views.
# The total problem size remains constant across thread counts.
#   0 = disabled
#   1 = enabled
RUN_FULL_SCALE=1

# Enable or disable proportional benchmark execution.
# Proportional benchmarks generate execution configurations where
# the problem size increases linearly with the thread count.
# Unlike full-scale benchmarks, thread count and problem size
# are coupled rather than independently combined.
#   0 = disabled
#   1 = enabled
RUN_PROPORTIONAL=1

# Number of warm-up executions performed before timed measurements.
# Warm-up executions are excluded from benchmark statistics.
WARMUP_REPS=3U

# Number of measured executions performed per benchmark configuration.
# These measurements are used to compute benchmark statistics.
WORK_REPS=5U


# =============================================================================
# Performance monitoring configuration
# =============================================================================

# Enable or disable experimental hardware performance counters
# collected through the Linux perf_event interface.
#   0 = disabled (default)
#   1 = enabled (diagnostic purposes only)
#
# Hardware counter collection has not yet been validated for
# OpenMP worker threads.
# Wall-clock timing and RAPL energy measurements remain enabled
# regardless of this setting, where supported.
ENABLE_HW_COUNTERS=0


# =============================================================================
# Workload and data generation configuration
# =============================================================================

# Artificial workload slowdown factor.
# Historically used to introduce additional computational iterations
# and increase kernel execution time to stabilize measurements.
# A value of 0 disables the artificial slowdown.
# NOTE: This parameter may no longer be used by the current implementation.
SLOWDOWN_FACTOR=0U

# Seed used for deterministic pseudo-random input generation.
# A fixed seed enables reproducible input generation across runs.
GENERATION_SEED=12345ULL
